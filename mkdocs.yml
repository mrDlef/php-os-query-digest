# Documentation site — https://mrdlef.github.io/php-os-query-digest/
#
# Built and deployed by .github/workflows/pages.yml, on tags only, alongside the
# playground it serves under /playground/. Same reason as the playground's:
# a page describing an API nobody can install yet is worse than a page a few
# days out of date. The workflow's manual button republishes after a typo.
#
# MkDocs and Material live nowhere but that workflow. They are not in
# composer.json and never will be — the runtime dependencies of this library are
# php and ext-json, and documentation tooling has no business changing that.

site_name: os-query-digest
site_description: Human-readable, loggable digests and stable fingerprints for OpenSearch DSL queries.
site_url: https://mrdlef.github.io/php-os-query-digest/
repo_url: https://github.com/mrDlef/php-os-query-digest
repo_name: mrDlef/php-os-query-digest
edit_uri: edit/main/docs/
copyright: LGPL-3.0-or-later

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  font: false
  custom_dir: overrides
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    # The reader's system preference decides, with a switch either way.
    # The auto entry needs the colours too, or Material falls back to its own
    # default — and auto is where most readers land.
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Follow my system
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light

markdown_extensions:
  - admonition
  - attr_list
  # Both are what Material's card grids need on the home page.
  - md_in_html
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Both of the playground's assets are the site's, not the page's: instant
# navigation swaps neither the <head> nor the trailing scripts, so a stylesheet
# or a module declared by one page alone never applies when that page is arrived
# at rather than loaded. Everything in playground.css is scoped to .playground,
# and javascripts/playground.js does nothing until a document contains it.
extra_css:
  - stylesheets/extra.css
  - playground/playground.css

extra_javascript:
  - path: javascripts/playground.js
    type: module

plugins:
  - search

# Outside the nav on purpose (see the note below the tree), which MkDocs would
# otherwise report on every build.
not_in_nav: |
  playground.md

nav:
  - Home: index.md
  - Getting started: getting-started.md
  # Problem-shaped, before the feature-shaped guides. UseCaseTest extracts every
  # aggregation on these pages from the markdown and runs it against a live node.
  - Use cases:
      - Overview: use-cases/index.md
      - Which shape got slow: use-cases/what-got-slow.md
      - What a deploy changed: use-cases/what-a-deploy-changed.md
      - What the hash is not for: use-cases/what-the-hash-is-not.md
  - Guides:
      - Log your queries: guides/logging.md
      - Options: guides/options.md
      - Command line: guides/cli.md
      - Teach it a query type: guides/extending.md
  - Reference:
      - Public API: reference/api.md
      - Query type coverage: reference/coverage.md
      - OpenSearch versions: reference/versions.md
  - Explanation:
      - How the fingerprint works: explanation/how-it-works.md
      - Hash stability: explanation/hash-stability.md
      - What counts as public: explanation/public-api.md
      - What it costs: explanation/performance.md
      - How the playground works: explanation/playground.md

# docs/playground.md *is* the playground: it selects overrides/playground.html,
# which carries the application's markup, its stylesheet and its module. What the
# workflow copies into docs/playground/ is only what the page loads — the
# stylesheet, the module, the generated data and the wasm runtime — and MkDocs
# emits those verbatim beside the page it generates at the same path.
#
# So the two must not both claim /playground/index.html. They no longer can:
# playground/ holds no index.html, and the Pages workflow checks that the built
# page is the application rather than a stray copy.
#
# It is deliberately not a nav entry — the announcement strip carries it, on
# every page, and the page itself hides the sidebar to give two panes the width.

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mrDlef/php-os-query-digest
      name: GitHub
    - icon: fontawesome/brands/php
      link: https://packagist.org/packages/mr-dlef/os-query-digest
      name: Packagist

# Fail the build on a broken internal link rather than shipping one. The site is
# generated from a repository where every other artefact is checked; this one
# should not be the exception.
strict: true
