name: Certification

# Deliberately not on every push. This job boots real OpenSearch nodes, which
# takes minutes and would slow down the feedback loop on a library that needs
# nothing but PHP to test. It runs on a schedule instead, so a version of
# OpenSearch that changes its mind about a query type surfaces on its own rather
# than during someone's release.
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      os2:
        description: 'OpenSearch 2.x image tag'
        default: '2'
      os3:
        description: 'OpenSearch 3.x image tag'
        default: '3'
  pull_request:
    # Only when the certification inputs themselves move.
    paths:
      - 'resources/probes.json'
      - 'resources/versions.json'
      - 'tools/certify.php'
      - 'tools/clients/composer.json'
      - 'tests/Integration/**'
      - '.github/workflows/certification.yml'

jobs:
  replay:
    name: OpenSearch ${{ matrix.major }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - major: '2.x'
            tag: '2'
          - major: '3.x'
            tag: '3'

    services:
      opensearch:
        image: opensearchproject/opensearch:${{ matrix.tag }}
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: 'true'
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
          cluster.routing.allocation.disk.threshold_enabled: 'false'
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 40

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, curl
          coverage: none

      - run: composer update --prefer-dist --no-progress

      # The OpenSearch clients ClientCaptureTest drives. Deliberately updated
      # rather than installed from a lock: the point of that test is to notice
      # when a client changes what it transports over, and a pinned lock would
      # hide exactly that. Without this step the test skips itself, which is how
      # every other job in the matrix gets away with never seeing these packages
      # — they need PHP 8.2 and this library's floor is 7.4.
      - name: The clients whose capture is claimed
        run: composer --working-dir=tools/clients update --prefer-dist --no-progress

      # Replays every verdict resources/versions.json records for whichever
      # version the service container happens to run. A drift in either
      # direction fails: a query that stopped being accepted, or one the matrix
      # still calls unsupported after OpenSearch grew it.
      # Two things at once: the certified matrix, and — because the clients are
      # installed above — that the transport integrations still capture the
      # clients docs/reference/coverage.md says they do.
      - name: Replay the certified matrix
        env:
          OPENSEARCH_URL: http://localhost:9200
        run: vendor/bin/phpunit --testsuite=integration
