name: playground

# Tags only, plus a manual button. The page prints fingerprints, and a
# fingerprint that no installable version produces is worse than no page at all
# — so it follows releases, not main.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer update --prefer-dist --no-progress

      # Checked, never regenerated here. The generated files are committed so
      # they can be reviewed in a diff; rebuilding them at deploy time would
      # publish something nobody read.
      - name: The committed data must match this commit
        run: php tools/build-playground.php --check

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: playground

      - id: deploy
        uses: actions/deploy-pages@v4
