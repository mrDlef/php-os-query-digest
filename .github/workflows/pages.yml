name: pages

# Tags only, plus a manual button, for the documentation and the playground
# alike. The playground prints fingerprints and the docs describe an API: a page
# that shows either before anyone can install it is worse than a page a few days
# out of date. The manual button is how a typo gets fixed without waiting.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy docs and playground
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer update --prefer-dist --no-progress

      # Checked, never regenerated here. The generated files are committed so
      # they can be reviewed in a diff; rebuilding them at deploy time would
      # publish something nobody read.
      - name: The committed data must match this commit
        run: php tools/build-playground.php --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # MkDocs lives here and nowhere else: not in composer.json, not in the
      # package. The runtime dependencies of this library are php and ext-json,
      # and documentation tooling has no business changing that.
      - name: Install MkDocs
        run: pip install --disable-pip-version-check mkdocs-material==9.5.49

      # --strict fails on a broken internal link rather than publishing one.
      - name: Build the site
        run: mkdocs build --strict

      # The docs take the root; the playground moves under /playground/. The
      # docs are what people arrive looking for, and the playground is one of
      # the things the docs point at.
      #
      # The guard is not decoration. A docs page named playground.md would make
      # MkDocs claim site/playground/, and `cp -r` into an existing directory
      # nests instead of failing — publishing a docs page where the application
      # should be, with the application at /playground/playground/. That is a
      # silent break, so it is checked rather than trusted.
      - name: Place the playground under the docs
        run: |
          if [ -e site/playground ]; then
            echo "::error::site/playground already exists — a docs page has taken that slug."
            exit 1
          fi
          cp -r playground site/playground
          test -f site/playground/index.html
          test -f site/playground/data/presets.json

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
