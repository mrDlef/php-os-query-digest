name: pages

# Tags only, plus a manual button, for the documentation and the playground
# alike. The playground prints fingerprints and the docs describe an API: a page
# that shows either before anyone can install it is worse than a page a few days
# out of date. The manual button is how a typo gets fixed without waiting.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy docs and playground
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer update --prefer-dist --no-progress

      # Checked, never regenerated here. The generated files are committed so
      # they can be reviewed in a diff; rebuilding them at deploy time would
      # publish something nobody read.
      - name: The committed data must match this commit
        run: php tools/build-playground.php --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # MkDocs lives here and nowhere else: not in composer.json, not in the
      # package. The runtime dependencies of this library are php and ext-json,
      # and documentation tooling has no business changing that.
      - name: Install MkDocs
        run: pip install --disable-pip-version-check mkdocs-material==9.5.49

      # Copied in before the build, so MkDocs owns /playground/ and emits it
      # verbatim. That is what lets every link to it stay relative — this site
      # is served from a subdirectory, where a root-relative /playground/ would
      # point off the site entirely.
      - name: Put the playground inside the docs
        run: cp -r playground docs/playground

      # --strict fails on a broken internal link rather than publishing one.
      - name: Build the site
        run: mkdocs build --strict

      # A docs page called playground.md would map to the same output path and
      # silently replace the application's index.html, leaving its data files
      # orphaned — a playground that loads nothing. MkDocs does not warn, so
      # the built page is checked for the application's own title.
      - name: The playground must be the playground
        run: |
          grep -q "os-query-digest playground" site/playground/index.html \
            || { echo "::error::/playground/ is not the application — a docs page has taken that path."; exit 1; }
          test -f site/playground/data/presets.json

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
