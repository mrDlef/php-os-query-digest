name: pages

# Tags only, plus a manual button, for the documentation and the playground
# alike. The playground prints fingerprints and the docs describe an API: a page
# that shows either before anyone can install it is worse than a page a few days
# out of date. The manual button is how a typo gets fixed without waiting.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy docs and playground
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer update --prefer-dist --no-progress

      # Checked, never regenerated here. The generated files are committed so
      # they can be reviewed in a diff; rebuilding them at deploy time would
      # publish something unreviewed.
      - name: The committed data must match this commit
        run: php tools/build-playground.php --check

      # Same reason, for the colours: both stylesheets are generated from one
      # source, and this deploys them.
      - name: The palette must be in sync
        run: php tools/build-palette.php --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # MkDocs lives here and nowhere else: not in composer.json, not in the
      # package. The runtime dependencies of this library are php and ext-json,
      # and documentation tooling has no business changing that.
      - name: Install MkDocs
        run: pip install --disable-pip-version-check mkdocs-material==9.5.49

      # The runtime is not committed — 12.5 MB of wasm does not belong in the
      # history of this library — so it is fetched here and checked against the
      # hashes in playground/runtime.lock.json. A substituted artefact fails the
      # deploy instead of reaching a browser.
      - name: Fetch and verify the wasm runtime
        run: php tools/fetch-runtime.php

      # What the page loads: its stylesheet, its module, the generated data and
      # the runtime. The page itself is docs/playground.md, which MkDocs emits at
      # the same path from overrides/playground.html — so these land beside it,
      # and every URL the module resolves stays relative to the module.
      - name: Put what the playground loads inside the docs
        run: cp -r playground docs/playground

      # --strict fails on a broken internal link rather than publishing one.
      - name: Build the site
        run: mkdocs build --strict

      # /playground/index.html is generated by MkDocs from a template, and a
      # stray playground/index.html in the copy above would take that path
      # instead — silently, since MkDocs does not warn about it. So the built
      # page is checked for the application's own root, and for everything it
      # goes on to load.
      - name: The playground must be the playground
        run: |
          grep -q 'id="pg-app"' site/playground/index.html \
            || { echo "::error::/playground/ is not the application — something else has taken that path."; exit 1; }
          grep -q 'javascripts/playground.js' site/playground/index.html \
            || { echo "::error::the built page loads no playground module."; exit 1; }
          grep -q 'playground.css' site/playground/index.html \
            || { echo "::error::the built page loads no playground stylesheet."; exit 1; }
          test -f site/playground/playground.css
          test -f site/playground/data/presets.json
          test -f site/playground/runtime/PhpWeb.mjs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
