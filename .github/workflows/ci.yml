name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: none

      - name: Install dependencies
        # No committed lock file: each PHP version resolves the highest
        # compatible PHPUnit (9.6 on 7.4, 11.x on 8.2+).
        run: composer update --prefer-dist --no-progress

      - name: Tests
        run: vendor/bin/phpunit

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer update --prefer-dist --no-progress
      - run: vendor/bin/phpstan analyse --no-progress

  coding-standard:
    name: Coding standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer update --prefer-dist --no-progress
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff

  rector:
    name: Rector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer update --prefer-dist --no-progress
      - run: vendor/bin/rector process --dry-run

  cli-image:
    name: CLI image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json
          coverage: none

      - run: composer update --prefer-dist --no-progress

      # The phar itself is covered by PharTest on every PHP version. What only
      # this job can prove is that the image built around it runs at all: a
      # wrong COPY path or a USER that cannot read its own binary is invisible
      # until someone pulls it.
      - name: Build the image
        run: docker build -f docker/cli.Dockerfile --build-arg VERSION=ci -t os-query-digest:ci .

      - name: It reports its build
        run: docker run --rm os-query-digest:ci --version | grep -q '(build ci)'

      # No hash written here: the image's answer is compared with this
      # checkout's, which is the only claim worth making. cmp rather than diff
      # in a pipeline — a reflowed byte is still a difference.
      - name: It agrees with the library it was built from
        run: |
          echo '{"query":{"term":{"service":"api"}},"size":50}' > query.json
          docker run -i --rm os-query-digest:ci --hash --index=logs-2026.08.13 < query.json > image.txt
          php bin/os-query-digest --hash --index=logs-2026.08.13 < query.json > local.txt
          cmp image.txt local.txt

  mutation-testing:
    name: Mutation testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 8.5 rather than Infection's own 8.3 floor: tools/infection/composer.lock
      # is committed so the mutation score is reproducible, and its dependencies
      # have moved past 8.3. A lock is only reproducible on a PHP that satisfies
      # it.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: json
          # The one job that needs a coverage driver — mutation testing cannot
          # tell a killed mutant from an unreached one without it.
          coverage: pcov

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress

      # Its own manifest: Infection needs PHP 8.3+ while this library supports
      # 7.4, so it must not sit in the root require-dev and constrain what the
      # other jobs can resolve.
      - name: Install Infection
        run: composer --working-dir=tools/infection install --no-progress

      - name: Mutation testing
        run: tools/infection/vendor/bin/infection --threads=max --no-progress --no-interaction --logger-github
